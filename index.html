<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V8</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
height:300px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
}

.msg{
padding:10px;
margin:8px 0;
border-radius:12px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:65%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
}

canvas{
display:none;
}

.install{
display:none;
background:#16a34a;
width:100%;
}


</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V8</h1>


<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>


<button class="install" id="installBtn">
📲 Zainstaluj Wariat AI
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera LIVE
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="clearMemory()">
🧹 Pamięć
</button>


</div>


<div id="camera"></div>


<canvas id="canvas"></canvas>


</div>


<script>


let chat=document.getElementById("chat");

let stream=null;

let video=null;

let installPrompt=null;



window.addEventListener(
"beforeinstallprompt",
(e)=>{

e.preventDefault();

installPrompt=e;

document.getElementById("installBtn").style.display="block";

});


document.getElementById("installBtn")
.onclick=async()=>{

if(installPrompt){

installPrompt.prompt();

installPrompt=null;

}

};
