<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V9.1</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
height:300px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
}

.msg{
padding:10px;
margin:8px 0;
border-radius:12px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:65%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
cursor:pointer;
}

button:active{
transform:scale(0.97);
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
background:black;
}

#camera{
overflow:hidden;
}

canvas{
display:none;
}

.photo{
margin-top:10px;
width:100%;
border-radius:15px;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V9.1</h1>


<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera LIVE
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="clearMemory()">
🧹 Pamięć
</button>


</div>


<div id="camera"></div>


<canvas id="canvas"></canvas>


<div id="photoResult"></div>


</div>



<script>


let chat=document.getElementById("chat");

let stream=null;

let video=null;



function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerText=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}




function speak(text){

let speech=new SpeechSynthesisUtterance(text);

speech.lang="pl-PL";

speech.rate=1;

speech.pitch=1;

window.speechSynthesis.speak(speech);

}




function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();


if(!text)return;


addMessage(text,"user");


let answer=
"Jestem Wariat AI V9.1. Widzę, że napisałeś: "+text;


addMessage(answer,"ai");


speak(answer);


localStorage.setItem(
"wariat_last",
text
);


input.value="";

}




function startVoice(){

let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Brak obsługi głosu w tej przeglądarce");

return;

}


let recognition=new SpeechRecognition();


recognition.lang="pl-PL";

recognition.start();



recognition.onresult=function(event){


let text=
event.results[0][0].transcript;


document.getElementById("msg").value=text;


sendMessage();


};


}

async function startCamera(){

// blokada przed stworzeniem drugiej kamery
if(video){
addMessage(
"📷 Kamera już działa.",
"ai"
);
return;
}


try{


stream = await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video=document.createElement("video");


video.autoplay=true;

video.playsInline=true;

video.muted=true;


video.srcObject=stream;



document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera uruchomiona. Jestem gotowy patrzeć.",
"ai"
);



}

catch(error){

addMessage(
"❌ Nie mam dostępu do kamery.",
"ai"
);

}

}




function takeView(){


if(!video){

addMessage(
"Najpierw uruchom kamerę.",
"ai"
);

return;

}



let canvas=document.getElementById("canvas");


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;



let ctx=canvas.getContext("2d");


ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);



let image=canvas.toDataURL(
"image/jpeg",
0.8
);



let img=document.createElement("img");


img.src=image;


img.className="photo";



document.getElementById("photoResult")
.innerHTML="";


document.getElementById("photoResult")
.appendChild(img);



addMessage(
"👁️ Zrobiłem zdjęcie. Następny etap: podłączenie mojego wzroku AI.",
"ai"
);



}




function stopCamera(){


if(stream){


stream.getTracks().forEach(
track=>track.stop()
);


}



stream=null;

video=null;


document.getElementById("camera")
.innerHTML="";


addMessage(
"⛔ Kamera zatrzymana.",
"ai"
);


}




function clearMemory(){


localStorage.clear();


addMessage(
"🧹 Pamięć została wyczyszczona.",
"ai"
);


}




// wczytanie ostatniej wiadomości

window.onload=function(){


let last=
localStorage.getItem("wariat_last");


if(last){

addMessage(
"Zapamiętałem ostatnio: "+last,
"ai"
);

}


};




</script>


</body>

</html>
