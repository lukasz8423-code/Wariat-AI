<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V5</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:500px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
height:300px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
margin:20px 0;
}

.msg{
padding:8px;
margin:5px 0;
border-radius:10px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:65%;
padding:12px;
border-radius:10px;
border:none;
}

button{
padding:13px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
margin-top:15px;
border-radius:15px;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V5</h1>


<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie...">

<button onclick="sendMessage()">
Wyślij
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="searchWeb()">
🌐 Internet
</button>


<button onclick="clearMemory()">
🧹 Wyczyść
</button>


</div>


</div>



<script>


let chat=document.getElementById("chat");



function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

saveChat();

}




function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();


if(!text)return;


addMessage(
"Ty: "+text,
"user"
);


let answer =
"Zapisałem: "+text+
"<br><br>Jestem gotowy do podłączenia prawdziwego AI.";



addMessage(
"Wariat AI: "+answer,
"ai"
);


input.value="";

}







function searchWeb(){


let q=prompt(
"Czego mam poszukać?"
);


if(!q)return;


addMessage(
"Wariat AI szuka informacji o: "+q,
"ai"
);



let link=
"https://www.google.com/search?q="
+encodeURIComponent(q);



addMessage(
"<a target='_blank' href='"+link+"'>🔎 Wyniki wyszukiwania</a>",
"ai"
);


}







let recognition;



function startVoice(){


if(!("webkitSpeechRecognition" in window)){

alert("Otwórz w Chrome Android");

return;

}


recognition=new webkitSpeechRecognition();

recognition.lang="pl-PL";


recognition.onresult=function(e){


document.getElementById("msg").value=
e.results[0][0].transcript;


sendMessage();


};


recognition.start();


}






function startCamera(){


navigator.mediaDevices.getUserMedia({

video:true

})

.then(stream=>{


let video=document.createElement("video");

video.srcObject=stream;

video.autoplay=true;

video.playsInline=true;


document.querySelector(".app").appendChild(video);


});


}






function saveChat(){

localStorage.setItem(
"wariat_chat",
chat.innerHTML
);

}




function loadChat(){

let old=
localStorage.getItem(
"wariat_chat"
);


if(old){

chat.innerHTML=old;

}

else{

addMessage(
"Wariat AI: Siema 👋 Jestem gotowy.",
"ai"
);

}


}



function clearMemory(){

localStorage.removeItem(
"wariat_chat"
);


chat.innerHTML="";


addMessage(
"Wariat AI: Pamięć wyczyszczona.",
"ai"
);

}



loadChat();





if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"sw.js?v=5"
);

}



</script>


</body>
</html>
