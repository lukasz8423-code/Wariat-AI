<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V14.0</title>

<meta name="theme-color" content="#2563eb">


<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{

width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;

}



h1{
text-align:center;
}



.avatar{

font-size:80px;
text-align:center;

}



.status{

background:#111827;
padding:12px;
border-radius:15px;
text-align:center;
margin-bottom:10px;

}



#chat{

height:320px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}



.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}



.user{

background:#2563eb;

}



.ai{

background:#374151;

}



input{

width:90%;
padding:12px;
border:0;
border-radius:10px;
margin-top:10px;

}



button{

width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;

}



.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}



video,img{

width:100%;
border-radius:15px;
margin-top:15px;

}


</style>

</head>



<body>


<div class="app">


<h1>🤖 Wariat AI V14.0</h1>


<div class="avatar">
😎
</div>



<div class="status">
🧠 Pamięć Łukasza + prawdziwy mózg AI
</div>




<div id="chat"></div>




<input id="msg" placeholder="Napisz do mnie">



<button id="sendBtn">
Wyślij
</button>





<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Reset
</button>


</div>



<div id="camera"></div>

<div id="photo"></div>



<script>


let chat =
document.getElementById("chat");


let stream=null;

let video=null;



// =========================
// ADRES TWOJEGO AI SERVERA
// =========================


// później zmienimy na publiczny adres

const AI_SERVER =
"http://localhost:3001/ai";





// =========================
// PAMIĘĆ
// =========================


let memory={

name:"",
likes:[],
facts:[],
history:[]

};






function loadMemory(){


let saved =
localStorage.getItem("wariat_v12_memory");



if(saved){


try{


memory=JSON.parse(saved);



}

catch(e){


console.log("Błąd pamięci");

}


}



}




function saveMemory(){


localStorage.setItem(
"wariat_v12_memory",
JSON.stringify(memory)
);


}






function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=
chat.scrollHeight;


}





function speak(text){


let s =
new SpeechSynthesisUtterance(text);


s.lang="pl-PL";


s.rate=0.95;


speechSynthesis.speak(s);


}

// =========================
// POŁĄCZENIE Z PRAWDZIWYM AI
// =========================


async function askExternalAI(question){


try{


let response =
await fetch(
AI_SERVER,
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

question:question,

memory:memory

})


}

);



let data =
await response.json();



return data.answer;



}

catch(error){


console.log(error);


return null;


}


}








// =========================
// MÓZG WARIAT AI V14
// =========================


async function aiBrain(text){


let q=text.toLowerCase().trim();





// IMIĘ


if(
q.startsWith("mam na imię") ||
q.startsWith("mam na imie")
){


let name=text
.replace(/^mam na imię/i,"")
.replace(/^mam na imie/i,"")
.trim();



if(name){


memory.name =
name.charAt(0).toUpperCase()
+
name.slice(1);



saveMemory();



return "Zapamiętałem. Od teraz będę mówił do Ciebie "+memory.name+".";

}


}







if(
q.includes("jak mam na imię") ||
q.includes("jak mam na imie")
){


return memory.name
?
"Masz na imię "+memory.name+"."
:
"Nie znam jeszcze Twojego imienia.";

}








// ZAPIS LUBIĘ


if(
q.includes("zapamiętaj") &&
(q.includes("lubię") || q.includes("lubie"))
){


let like=text
.replace(/zapamiętaj/i,"")
.replace(/że/i,"")
.replace(/lubię/i,"")
.replace(/lubie/i,"")
.trim();



if(like){


memory.likes.push(like);


saveMemory();



return "Zapamiętałem, że lubisz "+like+".";

}


}








// PAMIĘĆ


if(
q.includes("co pamiętasz") ||
q.includes("co pamietasz")
){


let result="";


if(memory.name){

result+="Masz na imię "+memory.name+". ";

}



if(memory.likes.length){

result+="Lubisz: "+
memory.likes.join(", ")+". ";

}



if(memory.facts.length){

result+="Informacje: "+
memory.facts.join(", ")+". ";

}



return result || "Moja pamięć jest pusta.";

}








// LOKALNA WIEDZA


let knowledge=[


{
keys:[
"ets2",
"ets",
"euro truck"
],

answer:
"Euro Truck Simulator 2 to gra firmy SCS Software, w której jeździsz ciężarówkami po Europie i rozwijasz firmę transportową."
},


{
keys:[
"autobus"
],

answer:
"Autobus to pojazd przeznaczony do przewozu wielu pasażerów. Mogą być miejskie, turystyczne i międzymiastowe."
},


{
keys:[
"barszcz sosnowskiego",
"barszcz"
],

answer:
"Barszcz Sosnowskiego to duża roślina inwazyjna. Kontakt z jej sokiem może powodować groźne reakcje skóry."
}


];







for(let item of knowledge){


for(let word of item.keys){


if(q.includes(word)){


return item.answer;


}


}


}








// JEŻELI NIE ZNA - PYTA PRAWDZIWE AI


let external =
await askExternalAI(text);



if(external){


return external;


}







return "Mój zewnętrzny mózg AI jest niedostępny.";

}







// =========================
// WYSYŁANIE WIADOMOŚCI
// =========================


async function sendMessage(){


let input =
document.getElementById("msg");



let text =
input.value.trim();



if(!text)return;




addMessage(text,"user");



let answer =
await aiBrain(text);



addMessage(answer,"ai");



speak(answer);



input.value="";


}







document
.getElementById("sendBtn")
.addEventListener(
"click",
sendMessage
);






document
.getElementById("msg")
.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){


sendMessage();


}


});

// =========================
// GŁOS
// =========================


function startVoice(){


let SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SR){

alert("Ta przeglądarka nie obsługuje głosu.");

return;

}



let recognition =
new SR();



recognition.lang="pl-PL";


recognition.start();



recognition.onresult=function(e){


let text =
e.results[0][0].transcript;



document.getElementById("msg").value=text;



sendMessage();



};


}








// =========================
// KAMERA
// =========================


async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video =
document.createElement("video");



video.autoplay=true;


video.playsInline=true;



video.srcObject=stream;



document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera uruchomiona.",
"ai"
);



}

catch(error){


addMessage(
"❌ Nie mogę uruchomić kamery: "+error.message,
"ai"
);


}


}








function takeView(){


if(!video){


addMessage(
"Najpierw uruchom kamerę.",
"ai"
);


return;

}



let canvas =
document.createElement("canvas");



canvas.width =
video.videoWidth;



canvas.height =
video.videoHeight;



let ctx =
canvas.getContext("2d");



ctx.drawImage(
video,
0,
0
);



let image =
canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo").innerHTML =
"<img src='"+image+"'>";



addMessage(
"👁️ Obraz zapisany. Analiza obrazu będzie kolejnym modułem.",
"ai"
);



}








function stopCamera(){


if(stream){


stream.getTracks()
.forEach(
track=>track.stop()
);


}



stream=null;


video=null;



document.getElementById("camera").innerHTML="";



addMessage(
"⛔ Kamera wyłączona.",
"ai"
);



}







// =========================
// PAMIĘĆ
// =========================


function showMemory(){


let result =
memory.name
?
"Masz na imię "+memory.name+". "
:
"Nie znam imienia. ";



if(memory.likes.length){


result +=
"Lubisz: "+
memory.likes.join(", ")+". ";


}



if(memory.facts.length){


result +=
"Informacje: "+
memory.facts.join(", ")+". ";


}



addMessage(
"🧠 "+result,
"ai"
);



}








function clearMemory(){


memory={

name:"",
likes:[],
facts:[],
history:[]

};



saveMemory();



addMessage(
"🗑️ Pamięć została wyczyszczona.",
"ai"
);



}








// =========================
// START
// =========================


window.onload=function(){


loadMemory();



if(memory.name){


addMessage(
"😎 Witaj ponownie "+memory.name+". Pamięć załadowana.",
"ai"
);


}else{


addMessage(
"😎 Wariat AI V14 gotowy.",
"ai"
);


}



};
