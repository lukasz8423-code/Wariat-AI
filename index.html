<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V9.5</title>

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}


h1{
text-align:center;
}


.avatar{
font-size:80px;
text-align:center;
}


.stats{

background:#111827;
padding:10px;
border-radius:15px;
margin-bottom:10px;
font-size:14px;

}



#chat{

height:280px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}



.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}



.user{

background:#2563eb;

}



.ai{

background:#374151;

}



input{

width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;

}



button{

width:100%;
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
font-size:16px;

}



.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}



video{

width:100%;
border-radius:15px;
margin-top:15px;

}



img{

width:100%;
border-radius:15px;
margin-top:10px;

}



.settings{

background:#374151;
padding:10px;
border-radius:15px;
margin-top:10px;
display:none;

}


.small{

font-size:12px;
color:#aaa;

}


</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V9.5</h1>


<div class="avatar">
🙂
</div>


<div class="stats">

🧠 Gemini użycie:<br>

💬 Wiadomości: <span id="msgCount">0</span><br>

📷 Zdjęcia: <span id="photoCount">0</span><br>

🔢 Wszystkie zapytania: <span id="totalCount">0</span>

</div>



<div id="chat"></div>



<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera

function speak(text){

let speech =
new SpeechSynthesisUtterance(text);


speech.lang="pl-PL";


speech.rate=1;


speechSynthesis.speak(speech);

}




function openSettings(){

let box =
document.getElementById("settings");


box.style.display =
box.style.display==="block"
?
"none"
:
"block";

}



function saveKey(){

let key =
document.getElementById("apiKey").value.trim();


if(!key)return;


localStorage.setItem(
"gemini_key",
key
);


addMessage(
"🔑 Klucz Gemini zapisany.",
"ai"
);


}




function getKey(){

return localStorage.getItem(
"gemini_key"
);

}




function sendMessage(){


let input =
document.getElementById("msg");


let text =
input.value.trim();


if(!text)return;



addMessage(
text,
"user"
);



stats.messages++;

stats.total++;

saveStats();



let answer =
"Jestem Wariat AI V9.5. Czekam na Twoje polecenie.";



addMessage(
answer,
"ai"
);



speak(answer);



input.value="";


}




function startVoice(){


let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("Brak obsługi głosu");

return;

}



let recognition =
new SpeechRecognition();



recognition.lang="pl-PL";


recognition.start();



recognition.onresult=function(event){


let text =
event.results[0][0].transcript;



document.getElementById("msg").value=text;


sendMessage();


};



}





async function startCamera(){


if(video){

addMessage(
"📷 Kamera już działa.",
"ai"
);

return;

}



try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video =
document.createElement("video");



video.autoplay=true;

video.playsInline=true;

video.muted=true;


video.srcObject=stream;



document.getElementById("camera")
.innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera gotowa.",
"ai"
);



}

catch(e){


addMessage(
"❌ Kamera: "+e.message,
"ai"
);


}

}




async function takeView(){


if(!video){


addMessage(
"Najpierw uruchom kamerę.",
"ai"
);


return;

}



let canvas =
document.createElement("canvas");



canvas.width =
video.videoWidth;


canvas.height =
video.videoHeight;



let ctx =
canvas.getContext("2d");


ctx.drawImage(
video,
0,
0
);



let image =
canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo")
.innerHTML =
"<img src='"+image+"'>";



stats.photos++;

stats.total++;

saveStats();



addMessage(
"👁️ Zdjęcie wysłane do Gemini.",
"ai"
);



await analyzeImage(image);


}

async function analyzeImage(image){


let key=getKey();



if(!key){

addMessage(
"⚠️ Brak klucza Gemini.",
"ai"
);

return;

}



let base64 =
image.split(",")[1];



try{


let response =
await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+key,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

contents:[

{

parts:[

{

text:
"Jesteś Wariat AI. Opisz po polsku co widzisz na zdjęciu."

},

{

inline_data:{

mime_type:"image/jpeg",

data:base64

}

}

]

}

]

})

}

);



let data =
await response.json();



if(data.error){


addMessage(
"❌ Gemini: "+data.error.message,
"ai"
);


return;

}



let answer =
data.candidates?.[0]
?.content
?.parts?.[0]
?.text;



if(!answer){

addMessage(
"❌ Brak odpowiedzi Gemini.",
"ai"
);

return;

}



addMessage(
"🤖 "+answer,
"ai"
);



speak(answer);



}




catch(error){


addMessage(
"❌ Błąd: "+error.message,
"ai"
);


}


}





function stopCamera(){


if(stream){

stream.getTracks()
.forEach(
track=>track.stop()
);

}



stream=null;

video=null;


document.getElementById("camera")
.innerHTML="";


addMessage(
"⛔ Kamera zatrzymana.",
"ai"
);


}





function resetStats(){


stats={

messages:0,

photos:0,

total:0

};


saveStats();


addMessage(
"♻️ Liczniki wyzerowane.",
"ai"
);


}




window.onload=function(){

loadStats();


if(getKey()){

addMessage(
"🧠 Gemini gotowy.",
"ai"
);

}

else{

addMessage(
"🔑 Dodaj klucz Gemini.",
"ai"
);

}


};



</script>


</body>

</html>
