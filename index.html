<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V9.2</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
height:280px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
}

.msg{
padding:10px;
margin:8px 0;
border-radius:12px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;
}

button{
width:100%;
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
font-size:16px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
background:black;
}

img{
width:100%;
border-radius:15px;
margin-top:10px;
}

.settings{
background:#374151;
padding:10px;
border-radius:15px;
margin-top:10px;
display:none;
}

.small{
font-size:12px;
color:#aaa;
}

</style>

</head>

<body>

<div class="app">

<h1>🤖 Wariat AI V9.2</h1>

<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>


<div class="buttons">

<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera LIVE
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="openSettings()">
⚙️ Gemini
</button>


<button onclick="clearMemory()">
🧹 Pamięć
</button>

</div>


<div id="camera"></div>


<div id="photo"></div>


<div class="settings" id="settings">

<input id="apiKey" placeholder="Wklej klucz Gemini API">

<button onclick="saveKey()">
💾 Zapisz klucz
</button>

<div class="small">
Klucz zapisuje się tylko na tym telefonie.
</div>

</div>


<script>

let chat=document.getElementById("chat");

let stream=null;

let video=null;


function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerText=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}



function speak(text){

let s=new SpeechSynthesisUtterance(text);

s.lang="pl-PL";

speechSynthesis.speak(s);

}


function openSettings(){

let box=document.getElementById("settings");

box.style.display =
box.style.display==="block"
?"none"
:"block";

}


function saveKey(){

let key=document.getElementById("apiKey").value.trim();

if(!key)return;


localStorage.setItem(
"gemini_key",
key
);


addMessage(
"🔑 Klucz Gemini zapisany.",
"ai"
);


}


function getKey(){

return localStorage.getItem(
"gemini_key"
);

}


function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();

if(!text)return;


addMessage(text,"user");


let answer=
"Jestem Wariat AI V9.2. Czekam na moje oczy Gemini.";


addMessage(answer,"ai");

speak(answer);


input.value="";

}

function startVoice(){

let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Telefon nie obsługuje rozpoznawania głosu");

return;

}


let recognition=new SpeechRecognition();


recognition.lang="pl-PL";

recognition.start();



recognition.onresult=function(event){

let text =
event.results[0][0].transcript;


document.getElementById("msg").value=text;


sendMessage();


};

}




async function startCamera(){


if(video){

addMessage(
"📷 Kamera już działa.",
"ai"
);

return;

}



try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video=document.createElement("video");


video.autoplay=true;

video.playsInline=true;

video.muted=true;


video.srcObject=stream;



document.getElementById("camera")
.innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Widzę obraz z kamery.",
"ai"
);



}

catch(e){


addMessage(
"❌ Nie udało się uruchomić kamery.",
"ai"
);


}

}




async function takeView(){


if(!video){


addMessage(
"Najpierw uruchom kamerę.",
"ai"
);


return;

}



let canvas=document.createElement("canvas");


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;



let ctx=canvas.getContext("2d");


ctx.drawImage(
video,
0,
0
);



let image =
canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo")
.innerHTML =
"<img src='"+image+"'>";



addMessage(
"👁️ Analizuję obraz...",
"ai"
);



await analyzeImage(image);



}




async function analyzeImage(image){


let key=getKey();


if(!key){


addMessage(
"⚠️ Najpierw dodaj klucz Gemini w ustawieniach.",
"ai"
);


return;

}



let base64 =
image.split(",")[1];



try{


let response =
await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+key,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

contents:[

{

parts:[

{

text:
"Opisz dokładnie co widzisz na tym zdjęciu. Odpowiedz po polsku."

},

{

inline_data:{

mime_type:"image/jpeg",

data:base64

}

}

]

}

]

})

}

);



let data =
await response.json();



let answer =
data.candidates?.[0]?.content?.parts?.[0]?.text;



if(!answer){

answer=
"Nie udało mi się rozpoznać obrazu.";

}



addMessage(
"🤖 "+answer,
"ai"
);


speak(answer);



}

catch(error){


addMessage(
"❌ Błąd połączenia z Gemini.",
"ai"
);


}



}




function stopCamera(){


if(stream){


stream.getTracks()
.forEach(
track=>track.stop()
);


}


stream=null;

video=null;


document.getElementById("camera")
.innerHTML="";


addMessage(
"⛔ Kamera zatrzymana.",
"ai"
);


}




function clearMemory(){

localStorage.removeItem(
"wariat_last"
);


addMessage(
"🧹 Pamięć wyczyszczona.",
"ai"
);


}

// sprawdzenie czy klucz już istnieje

window.onload=function(){

let key=getKey();


if(key){

addMessage(
"🧠 Gemini jest gotowy. Wariat ma oczy.",
"ai"
);

}

else{

addMessage(
"👁️ Dodaj klucz Gemini, żeby nauczyć mnie widzieć.",
"ai"
);

}


};

</script>


</body>

</html>
