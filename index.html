<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V14.1</title>

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 25px black;
}

h1{
text-align:center;
}

.avatar{
font-size:70px;
text-align:center;
}

.status{
background:#111827;
padding:10px;
border-radius:10px;
text-align:center;
}

#chat{
height:320px;
overflow:auto;
background:#111827;
margin-top:10px;
padding:10px;
border-radius:15px;
}


.msg{
padding:10px;
margin:8px 0;
border-radius:10px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}


input{
width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;
}


button{
width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
}


.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}


video,img{
width:100%;
border-radius:15px;
margin-top:10px;
}


</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V14.1</h1>


<div class="avatar">
😎
</div>


<div class="status">
🧠 Pamięć + AI
</div>



<div id="chat"></div>



<input id="msg" placeholder="Napisz do mnie">


<button id="sendBtn">
Wyślij
</button>


<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Reset
</button>


</div>


<div id="camera"></div>

<div id="photo"></div>


<script>


let chat =
document.getElementById("chat");


let stream=null;

let video=null;



// adres później zmienimy na publiczny backend

const AI_SERVER =
"http://localhost:3001/ai";




// ======================
// PAMIĘĆ
// ======================


let memory={

name:"",
likes:[],
facts:[]

};




function loadMemory(){


let saved =
localStorage.getItem("wariat_memory");


if(saved){

try{

memory=JSON.parse(saved);

}

catch(e){

console.log(e);

}

}


}




function saveMemory(){


localStorage.setItem(
"wariat_memory",
JSON.stringify(memory)
);


}




function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}





function speak(text){


let s=
new SpeechSynthesisUtterance(text);


s.lang="pl-PL";


speechSynthesis.speak(s);


}

// ======================
// POŁĄCZENIE Z AI
// ======================


async function askExternalAI(question){


try{


let response =
await fetch(
AI_SERVER,
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

question:question,

memory:memory

})


}

);



let data =
await response.json();



return data.answer;


}
catch(error){


console.log(error);


return null;


}


}






// ======================
// MÓZG WARIAT AI
// ======================


async function aiBrain(text){


let q =
text.toLowerCase().trim();





// IMIĘ


if(
q.startsWith("mam na imię") ||
q.startsWith("mam na imie")
){


let name =
text
.replace(/mam na imię/i,"")
.replace(/mam na imie/i,"")
.trim();



memory.name =
name;


saveMemory();



return "Zapamiętałem. Od teraz będę mówił do Ciebie "+name+".";

}







if(
q.includes("jak mam na imię") ||
q.includes("jak mam na imie")
){


return memory.name
?
"Masz na imię "+memory.name+"."
:
"Nie znam jeszcze Twojego imienia.";

}






// ZAPIS LUBIĘ


if(
q.includes("zapamiętaj") &&
q.includes("lubię")
){


let like =
text
.replace(/zapamiętaj/i,"")
.replace(/że/i,"")
.replace(/lubię/i,"")
.trim();



memory.likes.push(like);


saveMemory();



return "Zapamiętałem, że lubisz "+like+".";

}








// PAMIĘĆ


if(
q.includes("co pamiętasz") ||
q.includes("co pamietasz")
){


let result="";


if(memory.name){

result +=
"Masz na imię "+
memory.name+". ";

}



if(memory.likes.length){

result +=
"Lubisz: "+
memory.likes.join(", ")+". ";

}



return result || "Moja pamięć jest pusta.";

}







// PROSTA WIEDZA LOKALNA


if(
q.includes("ets2") ||
q.includes("euro truck")
){


return "Euro Truck Simulator 2 to gra firmy SCS Software o prowadzeniu ciężarówek po Europie.";

}



if(
q.includes("autobus")
){


return "Autobus to pojazd służący do przewozu wielu pasażerów.";

}




if(
q.includes("barszcz sosnowskiego")
){


return "Barszcz Sosnowskiego to niebezpieczna roślina, która może powodować podrażnienia skóry.";

}








// JEŚLI NIE ZNA - PYTA AI


let answer =
await askExternalAI(text);



if(answer){

return answer;

}



return "Nie mogę teraz połączyć się z moim mózgiem AI.";

}








// ======================
// WYSYŁANIE WIADOMOŚCI
// ======================


async function sendMessage(){


let input =
document.getElementById("msg");


let text =
input.value.trim();



if(!text){

return;

}



addMessage(
text,
"user"
);



let answer =
await aiBrain(text);



addMessage(
answer,
"ai"
);



speak(answer);



input.value="";

}




// PODPIĘCIE PRZYCISKU


document
.getElementById("sendBtn")
.addEventListener(
"click",
sendMessage
);





// ENTER


document
.getElementById("msg")
.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

sendMessage();

}


});

// ======================
// GŁOS
// ======================


function startVoice(){


let Speech =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!Speech){

addMessage(
"Ta przeglądarka nie obsługuje głosu.",
"ai"
);

return;

}



let recognition =
new Speech();



recognition.lang="pl-PL";


recognition.start();



recognition.onresult=function(e){


let text =
e.results[0][0].transcript;



document.getElementById("msg").value=text;


sendMessage();


};


}








// ======================
// KAMERA
// ======================


async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:true,

audio:false

});



video =
document.createElement("video");



video.autoplay=true;


video.playsInline=true;


video.srcObject=stream;



document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera działa.",
"ai"
);


}
catch(error){


addMessage(
"❌ Błąd kamery: "+error.message,
"ai"
);


}


}







function showMemory(){


let text="🧠 ";


if(memory.name){

text+="Masz na imię "+memory.name+". ";

}


if(memory.likes.length){

text+="Lubisz: "+
memory.likes.join(", ")+". ";

}



if(
!memory.name &&
memory.likes.length===0
){

text+="Pamięć jest pusta.";

}



addMessage(
text,
"ai"
);


}







function clearMemory(){


memory={

name:"",
likes:[],
facts:[]

};



saveMemory();


addMessage(
"🗑️ Pamięć wyczyszczona.",
"ai"
);


}







// ======================
// START APLIKACJI
// ======================


window.onload=function(){


loadMemory();



if(memory.name){


addMessage(
"😎 Witaj ponownie "+
memory.name+
". Pamięć załadowana.",
"ai"
);


}
else{


addMessage(
"😎 Wariat AI V14.1 gotowy.",
"ai"
);


}


};





</script>


</body>

</html>
