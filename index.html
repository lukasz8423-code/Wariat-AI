<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V9.5</title>

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

.stats{
background:#111827;
padding:10px;
border-radius:15px;
margin-bottom:10px;
font-size:14px;
}

#chat{
height:280px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
}

.msg{
padding:10px;
margin:8px 0;
border-radius:12px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;
}

button{
width:100%;
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
font-size:16px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video,img{
width:100%;
border-radius:15px;
margin-top:15px;
}

.settings{
background:#374151;
padding:10px;
border-radius:15px;
display:none;
margin-top:10px;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V9.5</h1>


<div class="avatar">
🙂
</div>


<div class="stats">

🧠 Gemini użycie:<br>

💬 Wiadomości:
<span id="msgCount">0</span><br>

📷 Zdjęcia:
<span id="photoCount">0</span><br>

🔢 Razem:
<span id="totalCount">0</span>

</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>


<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="openSettings()">
🔑 Gemini
</button>


<button onclick="resetStats()">
♻️ Reset
</button>


</div>


<div id="camera"></div>

<div id="photo"></div>


<div class="settings" id="settings">


<input id="apiKey" placeholder="Klucz Gemini">


<button onclick="saveKey()">
💾 Zapisz klucz
</button>


</div>


<script>


let chat=document.getElementById("chat");


let stream=null;

let video=null;


let stats={

messages:0,

photos:0,

total:0

};



function loadStats(){

let s=localStorage.getItem("wariat_stats");

if(s){

stats=JSON.parse(s);

}

updateStats();

}



function saveStats(){

localStorage.setItem(
"wariat_stats",
JSON.stringify(stats)
);

updateStats();

}



function updateStats(){

document.getElementById("msgCount").innerText=stats.messages;

document.getElementById("photoCount").innerText=stats.photos;

document.getElementById("totalCount").innerText=stats.total;

}



function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerText=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

function speak(text){

let s=new SpeechSynthesisUtterance(text);

s.lang="pl-PL";

speechSynthesis.speak(s);

}



function getKey(){

return localStorage.getItem("gemini_key");

}



function openSettings(){

let box=document.getElementById("settings");

box.style.display =
box.style.display==="block"
?
"none"
:
"block";

}



function saveKey(){

let key=document.getElementById("apiKey").value.trim();

if(!key)return;


localStorage.setItem(
"gemini_key",
key
);


addMessage(
"🔑 Klucz Gemini zapisany.",
"ai"
);


}



function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();


if(!text)return;


addMessage(
text,
"user"
);


stats.messages++;

stats.total++;

saveStats();


let answer=
"Jestem Wariat AI V9.5. Czekam na obraz z kamery.";


addMessage(
answer,
"ai"
);


speak(answer);


input.value="";

}





function startVoice(){

let SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SR){

alert("Brak obsługi głosu");

return;

}


let r=new SR();


r.lang="pl-PL";

r.start();


r.onresult=function(e){

document.getElementById("msg").value =
e.results[0][0].transcript;


sendMessage();

};


}





async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});


video=document.createElement("video");

video.autoplay=true;

video.playsInline=true;

video.muted=true;

video.srcObject=stream;


document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera działa.",
"ai"
);



}

catch(e){

addMessage(
"❌ Kamera: "+e.message,
"ai"
);

}


}





async function takeView(){


if(!video){

addMessage(
"Najpierw uruchom kamerę.",
"ai"
);

return;

}



let canvas=document.createElement("canvas");


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;


let ctx=canvas.getContext("2d");


ctx.drawImage(video,0,0);



let img=canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo").innerHTML =
"<img src='"+img+"'>";



stats.photos++;

stats.total++;

saveStats();



await analyzeImage(img);


}






async function analyzeImage(img){


let key=getKey();



if(!key){

addMessage(
"❌ Brak klucza Gemini.",
"ai"
);

return;

}



let base64=img.split(",")[1];



try{


let res=await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+key,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[{

parts:[

{

text:
"Opisz dokładnie po polsku co widzisz na zdjęciu."

},

{

inline_data:{

mime_type:"image/jpeg",

data:base64

}

}

]

}]

})

}

);



let data=await res.json();



if(data.error){

addMessage(
"❌ Gemini: "+data.error.message,
"ai"
);

return;

}



let answer =
data.candidates?.[0]?.content?.parts?.[0]?.text;



if(!answer){

addMessage(
"❌ Gemini nie zwrócił odpowiedzi.",
"ai"
);

return;

}



addMessage(
"🤖 "+answer,
"ai"
);


speak(answer);


}


catch(e){

addMessage(
"❌ Błąd: "+e.message,
"ai"
);

}


}






function stopCamera(){


if(stream){

stream.getTracks()
.forEach(t=>t.stop());

}


stream=null;

video=null;


document.getElementById("camera").innerHTML="";


}





function resetStats(){


stats={

messages:0,

photos:0,

total:0

};


saveStats();


addMessage(
"♻️ Liczniki wyzerowane.",
"ai"
);


}





window.onload=function(){

loadStats();


if(getKey()){

addMessage(
"🧠 Gemini gotowy.",
"ai"
);

}else{

addMessage(
"🔑 Dodaj klucz Gemini.",
"ai"
);

}


};



</script>


</body>

</html>
