<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V6</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.app{
width:95%;
max-width:500px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px #000;
}

h1{
text-align:center;
}

.avatar{
text-align:center;
font-size:80px;
}

#chat{
height:300px;
overflow:auto;
background:#111827;
border-radius:15px;
padding:10px;
margin:20px 0;
}

.msg{
padding:10px;
margin:8px 0;
border-radius:12px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:65%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
}

</style>

</head>

<body>


<div class="app">

<h1>🤖 Wariat AI V6</h1>

<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie...">

<button onclick="sendMessage()">Wyślij</button>


<div class="buttons">

<button onclick="startVoice()">🎤 Głos</button>

<button onclick="startCamera()">📷 Kamera LIVE</button>

<button onclick="stopCamera()">⛔ Stop</button>

<button onclick="clearMemory()">🧹 Pamięć</button>

</div>


<div id="camera"></div>


</div>



<script>


let chat=document.getElementById("chat");

let stream=null;



function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

saveMemory();

}




function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();


if(!text)return;


addMessage(
"Ty: "+text,
"user"
);



addMessage(
"Wariat AI: Przyjąłem wiadomość. Mój moduł AI czeka na podłączenie silnika.",
"ai"
);



input.value="";

}




function startVoice(){


if(!("webkitSpeechRecognition" in window)){

alert("Brak obsługi głosu w tej przeglądarce");

return;

}



let rec=new webkitSpeechRecognition();


rec.lang="pl-PL";


rec.onresult=function(e){

document.getElementById("msg").value=
e.results[0][0].transcript;

sendMessage();

};


rec.start();


}





async function startCamera(){


try{


stream=await navigator.mediaDevices.getUserMedia({

video:true

});


let video=document.createElement("video");

video.srcObject=stream;

video.autoplay=true;

video.playsInline=true;


document.getElementById("camera").innerHTML="";

document.getElementById("camera").appendChild(video);


addMessage(
"Wariat AI: Kamera LIVE działa 📷",
"ai"
);


}
catch(e){

addMessage(
"Wariat AI: Nie mam dostępu do kamery.",
"ai"
);

}


}





function stopCamera(){


if(stream){

stream.getTracks().forEach(
t=>t.stop()
);

stream=null;

document.getElementById("camera").innerHTML="";


addMessage(
"Wariat AI: Kamera wyłączona.",
"ai"
);

}


}




function saveMemory(){

localStorage.setItem(
"wariat_v6",
chat.innerHTML
);

}



function loadMemory(){

let data=
localStorage.getItem("wariat_v6");


if(data){

chat.innerHTML=data;

}else{

addMessage(
"Wariat AI: Siema 👋 Jestem gotowy.",
"ai"
);

}


}



function clearMemory(){

localStorage.removeItem("wariat_v6");

chat.innerHTML="";


addMessage(
"Wariat AI: Pamięć wyczyszczona.",
"ai"
);

}




loadMemory();



if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"sw.js?v=6"
);

}



</script>


</body>
</html>
