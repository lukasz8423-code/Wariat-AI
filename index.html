<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V7</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
height:280px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
}

.msg{
padding:8px;
margin:6px 0;
border-radius:10px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:65%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
margin-top:10px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
}

canvas{
display:none;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V7</h1>


<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>


<div class="buttons">

<button onclick="startVoice()">🎤 Głos</button>

<button onclick="startCamera()">📷 Kamera LIVE</button>

<button onclick="takeView()">👁️ Zobacz</button>

<button onclick="stopCamera()">⛔ Stop</button>

<button onclick="clearMemory()">🧹 Pamięć</button>

</div>


<div id="camera"></div>

<canvas id="canvas"></canvas>


</div>



<script>


let chat=document.getElementById("chat");

let stream=null;

let video=null;




function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

saveMemory();

}




function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();


if(!text)return;


addMessage(
"Ty: "+text,
"user"
);



addMessage(
"Wariat AI: Odebrałem wiadomość. Moduł rozmowy działa.",
"ai"
);


input.value="";

}




function startVoice(){


if(!("webkitSpeechRecognition" in window)){

alert("Brak obsługi głosu");

return;

}


let rec=new webkitSpeechRecognition();


rec.lang="pl-PL";


rec.onresult=function(e){

document.getElementById("msg").value=
e.results[0][0].transcript;


sendMessage();

};


rec.start();


}





async function startCamera(){


try{


stream=await navigator.mediaDevices.getUserMedia({

video:true

});


video=document.createElement("video");


video.srcObject=stream;

video.autoplay=true;

video.playsInline=true;


document.getElementById("camera").innerHTML="";


document.getElementById("camera").appendChild(video);


addMessage(
"Wariat AI: Kamera LIVE uruchomiona 📷",
"ai"
);


}

catch(e){

addMessage(
"Wariat AI: Nie mogę uruchomić kamery.",
"ai"
);

}


}





function stopCamera(){


if(stream){

stream.getTracks().forEach(
t=>t.stop()
);


stream=null;


document.getElementById("camera").innerHTML="";


addMessage(
"Wariat AI: Kamera wyłączona.",
"ai"
);

}


}





function takeView(){


if(!video){

addMessage(
"Wariat AI: Najpierw uruchom kamerę.",
"ai"
);

return;

}



let canvas=document.getElementById("canvas");


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;


let ctx=canvas.getContext("2d");


ctx.drawImage(
video,
0,
0
);



addMessage(
"Wariat AI: Obraz pobrany. Gotowy do analizy AI.",
"ai"
);



}




function saveMemory(){

localStorage.setItem(
"wariat_v7",
chat.innerHTML
);

}




function loadMemory(){

let old=
localStorage.getItem("wariat_v7");


if(old){

chat.innerHTML=old;

}

else{

addMessage(
"Wariat AI: Siema 👋 Jestem gotowy.",
"ai"
);

}


}




function clearMemory(){

localStorage.removeItem(
"wariat_v7"
);


chat.innerHTML="";


addMessage(
"Wariat AI: Pamięć wyczyszczona.",
"ai"
);


}




loadMemory();



if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"sw.js?v=7"
);

}


</script>


</body>
</html>
