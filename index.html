<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V12.3</title>

<meta name="theme-color" content="#2563eb">


<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{

width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;

}



h1{
text-align:center;
}


.avatar{

font-size:80px;
text-align:center;

}



.status{

background:#111827;
padding:12px;
border-radius:15px;
text-align:center;
margin-bottom:10px;

}



#chat{

height:320px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}



.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}



.user{

background:#2563eb;

}



.ai{

background:#374151;

}



input{

width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;

}



button{

width:100%;
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
font-size:16px;

}



.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}



video,img{

width:100%;
border-radius:15px;
margin-top:15px;

}


</style>

</head>



<body>


<div class="app">


<h1>🤖 Wariat AI V12.3</h1>


<div class="avatar">
😎
</div>


<div class="status">
🧠 Pamięć osobista + AI Brain
</div>



<div id="chat"></div>




<input id="msg" placeholder="Napisz do mnie">



<button id="sendBtn">
Wyślij
</button>




<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Reset
</button>


</div>



<div id="camera"></div>

<div id="photo"></div>



<script>


let chat=document.getElementById("chat");


let stream=null;

let video=null;




// ============================
// PAMIĘĆ V12.3
// ============================


let memory={

name:"",
likes:[],
facts:[],
history:[]

};





function loadMemory(){


let saved =
localStorage.getItem("wariat_v12_memory");



if(!saved){

saved =
localStorage.getItem("wariat_memory");

}




if(saved){

try{

let old=JSON.parse(saved);



memory={

name:old.name || "",

likes:old.likes || [],

facts:old.facts || [],

history:old.history || []

};



}

catch(e){

console.log("Błąd pamięci");

}


}




// naprawa starego błędnego wpisu

if(
memory.name &&
(
memory.name.includes("?") ||
memory.name.toLowerCase()=="jak"
)

){

memory.name="";

saveMemory();

}



}





function saveMemory(){


localStorage.setItem(
"wariat_v12_memory",
JSON.stringify(memory)
);


}





function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}





function speak(text){


let speech=
new SpeechSynthesisUtterance(text);


speech.lang="pl-PL";


speech.rate=0.95;


speechSynthesis.speak(speech);


}

// ============================
// MÓZG WARIAT AI V12.3
// ============================


function aiBrain(text){


let q=text.toLowerCase().trim();




// ============================
// IMIĘ
// ============================


if(
q.startsWith("mam na imię") ||
q.startsWith("mam na imie")
){


let name=text
.replace(/^mam na imię/i,"")
.replace(/^mam na imie/i,"")
.trim();



if(
!name ||
name=="?" ||
name.toLowerCase()=="jak"
){

return "Nie zrozumiałem imienia.";

}



memory.name =
name.charAt(0).toUpperCase()
+
name.slice(1);



saveMemory();



return "Zapamiętałem. Od teraz będę mówił do Ciebie "+memory.name+".";

}







if(
q.includes("jak mam na imię") ||
q.includes("jak mam na imie")
){


return memory.name
?
"Masz na imię "+memory.name+"."
:
"Nie znam jeszcze Twojego imienia.";

}







// ============================
// ZAPAMIĘTAJ LUBIĘ
// ============================


if(
q.includes("lubię") ||
q.includes("lubie")
){


let like=text
.replace(/zapamiętaj/i,"")
.replace(/zapamietaj/i,"")
.replace(/że/i,"")
.replace(/lubie/i,"")
.replace(/lubię/i,"")
.trim();



if(like){


memory.likes.push(like);


saveMemory();


return "Zapamiętałem, że lubisz "+like+".";

}


}








// ============================
// ZAPAMIĘTAJ INFORMACJĘ
// ============================


if(
q.startsWith("zapamiętaj") ||
q.startsWith("zapamietaj")
){


let fact=text
.replace(/zapamiętaj/i,"")
.replace(/zapamietaj/i,"")
.replace(/^że\s*/i,"")
.trim();



if(fact){


memory.facts.push(fact);


saveMemory();



return "Zapamiętałem: "+fact+".";

}


}








// ============================
// ZAPOMNIJ
// ============================


if(
q.startsWith("zapomnij")
){


let remove=text
.replace(/zapomnij/i,"")
.replace(/^że\s*/i,"")
.trim()
.toLowerCase();



memory.likes =
memory.likes.filter(
x=>x.toLowerCase()!=remove
);



memory.facts =
memory.facts.filter(
x=>x.toLowerCase()!=remove
);



saveMemory();



return "Usunąłem z pamięci: "+remove+".";

}








// ============================
// PAMIĘĆ
// ============================


if(
q.includes("co pamiętasz") ||
q.includes("co pamietasz")
){


let r="";


if(memory.name){

r+="Masz na imię "+memory.name+". ";

}



if(memory.likes.length){

r+="Lubisz: "+
memory.likes.join(", ")+". ";

}



if(memory.facts.length){

r+="Informacje: "+
memory.facts.join(", ")+". ";

}



return r || "Moja pamięć jest pusta.";

}







// ============================
// BAZA WIEDZY
// ============================


let knowledge=[


{
words:[
"ets",
"ets2",
"euro truck",
"scs"
],
answer:
"Euro Truck Simulator 2 to gra firmy SCS Software, w której prowadzisz ciężarówki po Europie."
},


{
words:[
"gta"
],
answer:
"GTA to seria gier firmy Rockstar Games."
},


{
words:[
"barszcz",
"sosnowskiego"
],
answer:
"Barszcz Sosnowskiego to niebezpieczna roślina, która może powodować poparzenia skóry."
},


{
words:[
"android",
"redmi"
],
answer:
"Android to system operacyjny telefonów. Redmi to marka smartfonów Xiaomi."
}


];





for(let item of knowledge){

for(let word of item.words){


if(q.includes(word)){


return item.answer;


}


}


}







// CZAS


if(
q.includes("godzina")
){


let d=new Date();


return "Jest teraz godzina "+
d.getHours()+":"+
String(d.getMinutes()).padStart(2,"0")+".";

}






// HISTORIA

memory.history.push({

user:text,

time:new Date().toLocaleString()

});


if(memory.history.length>50){

memory.history.shift();

}


saveMemory();




return "Nie mam jeszcze odpowiedzi na to pytanie. Czekam na podłączenie prawdziwego AI.";

}








// ============================
// WYSYŁANIE
// ============================


function sendMessage(){


let input=document.getElementById("msg");


let text=input.value.trim();



if(!text)return;



addMessage(text,"user");



let answer=aiBrain(text);



addMessage(answer,"ai");


speak(answer);



input.value="";


}






document
.getElementById("sendBtn")
.addEventListener(
"click",
sendMessage
);





document
.getElementById("msg")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

sendMessage();

}

}
);

// ============================
// GŁOS
// ============================


function startVoice(){


let SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SR){

alert("Brak obsługi głosu");

return;

}



let rec=new SR();


rec.lang="pl-PL";


rec.start();



rec.onresult=function(e){


document.getElementById("msg").value=
e.results[0][0].transcript;



sendMessage();


};


}






// ============================
// KAMERA
// ============================


async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video=document.createElement("video");


video.autoplay=true;

video.playsInline=true;


video.srcObject=stream;



document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera działa.",
"ai"
);



}


catch(e){


addMessage(
"❌ Kamera: "+e.message,
"ai"
);


}


}








function takeView(){


if(!video){

addMessage(
"Najpierw uruchom kamerę.",
"ai"
);


return;

}



let canvas=document.createElement("canvas");


canvas.width=video.videoWidth;


canvas.height=video.videoHeight;



let ctx=canvas.getContext("2d");


ctx.drawImage(video,0,0);



let img=canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo").innerHTML=
"<img src='"+img+"'>";



addMessage(
"👁️ Zdjęcie wykonane.",
"ai"
);


}








function stopCamera(){


if(stream){

stream.getTracks()
.forEach(t=>t.stop());

}


stream=null;

video=null;


document.getElementById("camera").innerHTML="";


addMessage(
"⛔ Kamera wyłączona.",
"ai"
);


}







function showMemory(){


addMessage(
"🧠 "+aiBrain("co pamiętasz"),
"ai"
);


}







function clearMemory(){


memory={

name:"",
likes:[],
facts:[],
history:[]

};


saveMemory();



addMessage(
"🗑️ Pamięć wyczyszczona.",
"ai"
);


}







window.onload=function(){


loadMemory();



if(memory.name){


addMessage(
"😎 Witaj ponownie "+memory.name+". Pamięć załadowana.",
"ai"
);


}else{


addMessage(
"😎 Wariat AI V12.3 gotowy.",
"ai"
);


}



};



</script>


</body>

</html>
