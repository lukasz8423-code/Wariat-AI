<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V10</title>

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}


h1{
text-align:center;
}


.avatar{
font-size:80px;
text-align:center;
}


.status{
background:#111827;
padding:10px;
border-radius:15px;
margin-bottom:10px;
}


#chat{

height:300px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}


.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}


.user{

background:#2563eb;

}


.ai{

background:#374151;

}



input{

width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;

}


button{

width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;

}


.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}


video,img{

width:100%;
border-radius:15px;
margin-top:15px;

}


</style>


</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V10</h1>


<div class="avatar">
😎
</div>


<div class="status" id="memoryInfo">

🧠 Pamięć Wariata aktywna

</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>


<div class="buttons">


<button onclick="startVoice()">
🎤 Mów
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Patrz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Wyczyść
</button>


</div>


<div id="camera"></div>


<div id="photo"></div>


<script>


let chat=document.getElementById("chat");


let stream=null;

let video=null;



let memory = JSON.parse(

localStorage.getItem("wariat_memory")

)

||

{

name:"",

facts:[]

};



function saveMemory(){

localStorage.setItem(

"wariat_memory",

JSON.stringify(memory)

);

}




function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}

function speak(text){

let speech =
new SpeechSynthesisUtterance(text);

speech.lang="pl-PL";

speech.rate=0.95;

speech.pitch=1;

speechSynthesis.speak(speech);

}





function think(text){

let t=text.toLowerCase();



if(t.includes("mam na imię")){

let name=text
.split("mam na imię")[1]
.trim();


memory.name=name;


saveMemory();


return "Zapamiętałem. Od teraz będę mówił do Ciebie "+name+".";

}




if(t.includes("jak mam na imię")){


if(memory.name){

return "Masz na imię "+memory.name+".";

}


return "Jeszcze mi nie powiedziałeś jak masz na imię.";

}





if(t.includes("zapamiętaj")){


let info=text
.replace("zapamiętaj","")
.trim();



if(info){

memory.facts.push(info);

saveMemory();


return "Dobra, zapamiętałem: "+info;

}


}




if(t.includes("co pamiętasz")){


let wynik="";


if(memory.name){

wynik+="Imię: "+memory.name+". ";

}


if(memory.facts.length){

wynik+="Pamiętam też: "+memory.facts.join(", ");

}


if(!wynik){

wynik="Na razie moja pamięć jest pusta.";

}


return wynik;

}





if(t.includes("cześć") ||
t.includes("hej")){


return "Siema 😎 Jestem Wariat AI V10. Co robimy?";

}




if(t.includes("kim jesteś")){


return "Jestem Wariat AI. Twój cyfrowy pomocnik.";

}





return "Słucham. Jeszcze się uczę, ale działam i jestem z Tobą.";

}






function sendMessage(){


let input=document.getElementById("msg");


let text=input.value.trim();


if(!text)return;



addMessage(
text,
"user"
);



let answer=think(text);



addMessage(
answer,
"ai"
);



speak(answer);



input.value="";


}




function startVoice(){


let Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!Recognition){

alert("Telefon nie obsługuje rozpoznawania głosu");

return;

}



let rec=new Recognition();


rec.lang="pl-PL";


rec.start();



rec.onresult=function(event){


let text =
event.results[0][0].transcript;



document.getElementById("msg").value=text;


sendMessage();


};



}





async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video=document.createElement("video");


video.autoplay=true;

video.playsInline=true;


video.srcObject=stream;



document.getElementById("camera")
.innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera uruchomiona.",
"ai"
);



}


catch(e){


addMessage(
"❌ Nie mogę uruchomić kamery.",
"ai"
);


}


}

function takeView(){


if(!video){

addMessage(
"Najpierw włącz kamerę.",
"ai"
);

return;

}



let canvas=document.createElement("canvas");


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;



let ctx=canvas.getContext("2d");


ctx.drawImage(video,0,0);



let img=canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo")
.innerHTML=
"<img src='"+img+"'>";



addMessage(
"👁️ Widzę obraz z kamery. Na razie uczę się rozpoznawania świata.",
"ai"
);



}




function stopCamera(){


if(stream){

stream.getTracks()
.forEach(
track=>track.stop()
);

}


stream=null;

video=null;


document.getElementById("camera").innerHTML="";


addMessage(
"⛔ Kamera wyłączona.",
"ai"
);


}




function showMemory(){


let text=think("co pamiętasz");


addMessage(
"🧠 "+text,
"ai"
);



}




function clearMemory(){


memory={

name:"",

facts:[]

};



saveMemory();



addMessage(
"🗑️ Pamięć wyczyszczona.",
"ai"
);



}




window.onload=function(){


if(memory.name){

addMessage(
"Witaj ponownie "+memory.name+" 😎",
"ai"
);

}else{


addMessage(
"Siema 😎 Jestem Wariat AI V10.",
"ai"
);


}


};



</script>


</body>

</html>
