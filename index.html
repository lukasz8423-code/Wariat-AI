<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body {
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app {

    width:95%;
    max-width:500px;
    background:#1f2937;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px #000;

}

h1 {

    text-align:center;

}


.avatar {

    font-size:80px;
    text-align:center;

}


#chat {

    background:#111827;
    min-height:200px;
    margin:20px 0;
    border-radius:15px;
    padding:10px;
    overflow:auto;

}


input {

    width:65%;
    padding:12px;
    border-radius:10px;
    border:none;

}


.send {

    width:25%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;

}


.buttons {

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

}


button {

    padding:15px;
    border:none;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:16px;

}


button:hover {

    background:#1d4ed8;

}


video {

    margin-top:15px;
    border-radius:15px;

}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI</h1>


<div class="avatar">
🙂
</div>


<div id="chat">

<p>Wariat AI: Siema 👋 Jestem gotowy.</p>

</div>



<input id="msg" placeholder="Napisz coś...">

<button class="send" onclick="sendMessage()">
Wyślij
</button>



<br><br>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="searchWeb()">
🌐 Internet
</button>


<button onclick="memory()">
🧠 Pamięć
</button>


</div>


</div>



<script>


function sendMessage(){


let input=document.getElementById("msg");

let chat=document.getElementById("chat");


if(input.value.trim()=="") return;



chat.innerHTML += 
"<p><b>Ty:</b> "+input.value+"</p>";



chat.innerHTML +=
"<p><b>Wariat AI:</b> Zapisałem wiadomość. Podłączymy teraz prawdziwe AI.</p>";



input.value="";


chat.scrollTop = chat.scrollHeight;


}





let recognition;



function startVoice(){



if(!('webkitSpeechRecognition' in window)){


alert("Użyj Chrome na Androidzie do obsługi głosu.");

return;


}



recognition = new webkitSpeechRecognition();


recognition.lang="pl-PL";


recognition.continuous=false;



recognition.onresult=function(event){


let text =
event.results[0][0].transcript;



document.getElementById("msg").value=text;



sendMessage();



};



recognition.start();



}






function startCamera(){



navigator.mediaDevices.getUserMedia({

video:true

})


.then(stream=>{


let video=document.createElement("video");


video.srcObject=stream;


video.autoplay=true;


video.playsInline=true;


document.querySelector(".app").appendChild(video);



})


.catch(()=>{


alert("Nie udało się uruchomić kamery.");


});



}







function searchWeb(){


alert("Moduł wyszukiwania internetu dodamy teraz jako następny etap.");


}






function memory(){


alert("Moduł pamięci AI będzie kolejnym modułem.");


}






if("serviceWorker" in navigator){


navigator.serviceWorker.register("sw.js");


}


</script>


</body>

</html>
