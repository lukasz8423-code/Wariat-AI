<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V3</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.app{
width:95%;
max-width:500px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
background:#111827;
padding:10px;
height:250px;
overflow:auto;
border-radius:15px;
margin:20px 0;
}

input{
width:65%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:14px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
margin-top:15px;
border-radius:15px;
}

a{
color:#60a5fa;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V3</h1>


<div class="avatar">
🙂
</div>


<div id="chat">

<p>Wariat AI: Nowa wersja uruchomiona ✅</p>

</div>


<input id="msg" placeholder="Napisz pytanie">


<button onclick="sendMessage()">
Wyślij
</button>


<div class="buttons">

<button onclick="startVoice()">🎤 Głos</button>

<button onclick="startCamera()">📷 Kamera</button>

<button onclick="searchWeb()">🌐 Internet</button>

<button onclick="memory()">🧠 Pamięć</button>

</div>


</div>



<script>


function addMessage(text){

let chat=document.getElementById("chat");

chat.innerHTML += "<p>"+text+"</p>";

chat.scrollTop=chat.scrollHeight;

}



function sendMessage(){

let input=document.getElementById("msg");

if(input.value==="") return;


addMessage("Ty: "+input.value);


addMessage(
"Wariat AI: Otrzymałem wiadomość. Moduł AI będzie kolejnym etapem."
);


input.value="";

}





function searchWeb(){

let pytanie=prompt(
"Czego mam poszukać?"
);


if(!pytanie)return;


addMessage(
"Wariat AI szuka: "+pytanie
);


let tekst=encodeURIComponent(pytanie);


addMessage(
"🔎 <a target='_blank' href='https://www.google.com/search?q="+tekst+"'>Wyniki</a>"
);


addMessage(
"📷 <a target='_blank' href='https://www.google.com/search?tbm=isch&q="+tekst+"'>Zdjęcia</a>"
);


}






let recognition;


function startVoice(){


if(!window.webkitSpeechRecognition){

alert("Użyj Chrome na Androidzie");

return;

}


recognition=new webkitSpeechRecognition();

recognition.lang="pl-PL";


recognition.onresult=function(e){

document.getElementById("msg").value =
e.results[0][0].transcript;


sendMessage();

};


recognition.start();


}







function startCamera(){


navigator.mediaDevices.getUserMedia({
video:true
})

.then(stream=>{


let video=document.createElement("video");

video.srcObject=stream;

video.autoplay=true;

video.playsInline=true;


document.querySelector(".app").appendChild(video);


})

.catch(()=>{

alert("Brak dostępu do kamery");

});


}






function memory(){


let data=localStorage.getItem("ostatnie");


if(data){

addMessage(
"🧠 Pamiętam: "+data
);

}

else{

addMessage(
"🧠 Brak zapisanej pamięci"
);

}


}






if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js?v=3");

}


</script>


</body>

</html>
