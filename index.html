<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V10.1</title>

<meta name="theme-color" content="#2563eb">


<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}


h1{
text-align:center;
}


.avatar{
font-size:80px;
text-align:center;
}


.status{
background:#111827;
padding:10px;
border-radius:15px;
margin-bottom:10px;
}


#chat{

height:300px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}


.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}


.user{

background:#2563eb;

}


.ai{

background:#374151;

}



input{

width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;

}


button{

width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;

}



.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}



video,img{

width:100%;
border-radius:15px;
margin-top:15px;

}


</style>


</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V10.1</h1>


<div class="avatar">
😎
</div>


<div class="status">

🧠 Pamięć Wariata aktywna

</div>



<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Wyczyść
</button>


</div>



<div id="camera"></div>

<div id="photo"></div>



<script>


let chat =
document.getElementById("chat");


let stream=null;

let video=null;



let memory =
JSON.parse(
localStorage.getItem("wariat_memory")
)
||
{
name:"",
facts:[]
};




function saveMemory(){

localStorage.setItem(
"wariat_memory",
JSON.stringify(memory)
);

}




function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=
chat.scrollHeight;


}




function speak(text){


let speech =
new SpeechSynthesisUtterance(text);


speech.lang="pl-PL";


speech.rate=0.95;


speech.pitch=1;


speechSynthesis.speak(speech);


}




function think(text){


let t=text.toLowerCase().trim();



if(
t.includes("mam na imię") ||
t.includes("mam na imie")
){


let name=text
.replace(/mam na imię/i,"")
.replace(/mam na imie/i,"")
.trim();



memory.name =
name.charAt(0).toUpperCase()
+
name.slice(1);



saveMemory();



return "Zapamiętałem. Od teraz będę mówił do Ciebie "+memory.name+".";

}

if(
t.includes("jak mam na imię") ||
t.includes("jak mam na imie")
){

if(memory.name){

return "Masz na imię "+memory.name+".";

}

return "Jeszcze mi nie powiedziałeś swojego imienia.";

}




if(
t.startsWith("zapamiętaj") ||
t.startsWith("zapamietaj")
){

let info=text
.replace(/zapamiętaj/i,"")
.replace(/zapamietaj/i,"")
.trim();



if(info){

memory.facts.push(info);

saveMemory();


return "Dobra, zapamiętałem: "+info;

}


return "Powiedz mi co mam zapamiętać.";

}





if(
t.includes("co pamiętasz") ||
t.includes("co pamietasz")
){

let result="";


if(memory.name){

result+="Twoje imię to "+memory.name+". ";

}


if(memory.facts.length){

result+="Pamiętam też: "+
memory.facts.join(", ")+". ";

}



if(!result){

result="Moja pamięć jest jeszcze pusta.";

}


return result;

}





if(
t.includes("cześć") ||
t.includes("czesc") ||
t.includes("hej") ||
t.includes("siema")
){


let answers=[

"Siema 😎 Co dziś robimy?",

"Witaj 😎 Jestem gotowy.",

"No hej. Działamy dalej?"

];


return answers[
Math.floor(Math.random()*answers.length)
];


}





if(t.includes("co tam u ciebie")){


return "U mnie dobrze 😎 Działam i rozwijamy Wariata krok po kroku.";


}




if(t.includes("kim jesteś")){


return "Jestem Wariat AI. Twoim cyfrowym pomocnikiem.";


}




if(
t.includes("dziękuję") ||
t.includes("dziekuje")
){


return "Nie ma sprawy 😎";

}




let fallback=[

"Słucham 😎",

"Jestem tutaj. Mów dalej.",

"Jeszcze się uczę, ale działam.",

"Co robimy dalej?"

];


return fallback[
Math.floor(Math.random()*fallback.length)
];


}






function sendMessage(){


let input =
document.getElementById("msg");


let text =
input.value.trim();



if(!text)return;



addMessage(
text,
"user"
);



let answer =
think(text);



addMessage(
answer,
"ai"
);



speak(answer);



input.value="";


}





function startVoice(){


let Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!Recognition){

alert("Telefon nie obsługuje głosu");

return;

}



let rec =
new Recognition();



rec.lang="pl-PL";


rec.start();



rec.onresult=function(event){


let text =
event.results[0][0].transcript;



document.getElementById("msg").value=text;


sendMessage();


};


}





async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video =
document.createElement("video");



video.autoplay=true;

video.playsInline=true;


video.srcObject=stream;



document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera działa.",
"ai"
);



}

catch(e){


addMessage(
"❌ Problem z kamerą.",
"ai"
);


}


}






function takeView(){


if(!video){


addMessage(
"Najpierw włącz kamerę.",
"ai"
);


return;

}



let canvas =
document.createElement("canvas");



canvas.width =
video.videoWidth;


canvas.height =
video.videoHeight;



let ctx =
canvas.getContext("2d");



ctx.drawImage(
video,
0,
0
);



let img =
canvas.toDataURL(
"image/jpeg",
0.8
);



document.getElementById("photo")
.innerHTML =
"<img src='"+img+"'>";



addMessage(
"👁️ Zrobiłem zdjęcie. Na razie widzę obraz, ale uczę się rozpoznawania świata.",
"ai"
);


}




function stopCamera(){


if(stream){

stream.getTracks()
.forEach(
track=>track.stop()
);

}



stream=null;

video=null;


document.getElementById("camera").innerHTML="";


addMessage(
"⛔ Kamera wyłączona.",
"ai"
);


}




function showMemory(){


let result =
think("co pamiętasz");


addMessage(
"🧠 "+result,
"ai"
);


}




function clearMemory(){


memory={

name:"",
facts:[]

};



saveMemory();


addMessage(
"🗑️ Pamięć wyczyszczona.",
"ai"
);


}




window.onload=function(){


if(memory.name){


addMessage(
"Witaj ponownie "+memory.name+" 😎",
"ai"
);


}else{


addMessage(
"Siema 😎 Jestem Wariat AI V10.1.",
"ai"
);


}


};



</script>


</body>

</html>
