<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V9.4 TEST</title>

<meta name="theme-color" content="#2563eb">

<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.app{
width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;
}

h1{
text-align:center;
}

.avatar{
font-size:80px;
text-align:center;
}

#chat{
height:320px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;
}

.msg{
padding:10px;
margin:8px 0;
border-radius:12px;
}

.user{
background:#2563eb;
}

.ai{
background:#374151;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:0;
margin-top:10px;
}

button{
width:100%;
padding:12px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
margin-top:10px;
font-size:16px;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
}

img{
width:100%;
border-radius:15px;
margin-top:10px;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V9.4 TEST</h1>


<div class="avatar">
🙂
</div>


<div id="chat"></div>


<input id="msg" placeholder="Napisz do mnie">


<button onclick="sendMessage()">
Wyślij
</button>


<div class="buttons">


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="checkModels()">
🔍 Sprawdź Gemini
</button>


<button onclick="openKey()">
🔑 Klucz Gemini
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="clearMemory()">
🧹 Pamięć
</button>


</div>


<div id="camera"></div>

<div id="photo"></div>


<input id="keyBox" placeholder="Wklej klucz Gemini" style="display:none">


<button id="saveKey" onclick="saveKey()" style="display:none">
💾 Zapisz klucz
</button>


<script>


let chat=document.getElementById("chat");

let stream=null;

let video=null;


function addMessage(text,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerText=text;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}


function speak(text){

let s=new SpeechSynthesisUtterance(text);

s.lang="pl-PL";

speechSynthesis.speak(s);

}

function getKey(){

return localStorage.getItem("gemini_key");

}



function openKey(){

document.getElementById("keyBox").style.display="block";

document.getElementById("saveKey").style.display="block";

}



function saveKey(){

let key=document.getElementById("keyBox").value.trim();


if(!key)return;


localStorage.setItem(
"gemini_key",
key
);


addMessage(
"🔑 Klucz zapisany.",
"ai"
);


}



function sendMessage(){

let text=
document.getElementById("msg").value.trim();


if(!text)return;


addMessage(
text,
"user"
);


let answer=
"Jestem Wariat AI V9.4 TEST. Sprawdzam moje oczy Gemini.";


addMessage(
answer,
"ai"
);


speak(answer);


document.getElementById("msg").value="";

}




async function checkModels(){


let key=getKey();



if(!key){

addMessage(
"❌ Brak klucza Gemini.",
"ai"
);

return;

}



addMessage(
"🔍 Sprawdzam dostępne modele Gemini...",
"ai"
);



try{


let response =
await fetch(

"https://generativelanguage.googleapis.com/v1beta/models?key="+key

);



let data =
await response.json();



if(data.error){

addMessage(
"❌ Gemini błąd: "+data.error.message,
"ai"
);

return;

}



let lista="Dostępne modele:\n\n";



data.models.forEach(model=>{


lista +=
model.name+
"\nObsługa: "+
(model.supportedGenerationMethods || []).join(", ")
+
"\n\n";


});



addMessage(
lista,
"ai"
);



}

catch(e){


addMessage(
"❌ Błąd połączenia: "+e.message,
"ai"
);


}


}




async function startCamera(){


if(video)return;



try{


stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video=document.createElement("video");


video.autoplay=true;

video.playsInline=true;

video.muted=true;


video.srcObject=stream;


document.getElementById("camera")
.innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera działa.",
"ai"
);


}

catch(e){


addMessage(
"❌ Kamera: "+e.message,
"ai"
);


}

}




async function takeView(){


if(!video){

addMessage(
"Najpierw uruchom kamerę.",
"ai"
);

return;

}


let canvas=document.createElement("canvas");


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;



let ctx=canvas.getContext("2d");


ctx.drawImage(video,0,0);



let img=
canvas.toDataURL(
"image/jpeg"
);



document.getElementById("photo")
.innerHTML=
"<img src='"+img+"'>";



addMessage(
"👁️ Zdjęcie wykonane.",
"ai"
);


}

function stopCamera(){


if(stream){

stream.getTracks()
.forEach(
track=>track.stop()
);

}


stream=null;

video=null;


document.getElementById("camera")
.innerHTML="";


addMessage(
"⛔ Kamera zatrzymana.",
"ai"
);


}




function clearMemory(){


localStorage.removeItem(
"gemini_key"
);


localStorage.removeItem(
"wariat_last"
);


addMessage(
"🧹 Pamięć wyczyszczona.",
"ai"
);


}



window.onload=function(){


if(getKey()){


addMessage(
"🧠 Klucz Gemini znaleziony.",
"ai"
);


}else{


addMessage(
"🔑 Dodaj klucz Gemini.",
"ai"
);


}


};



</script>


</body>

</html>
