<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V4</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body {
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app {
    width:95%;
    max-width:500px;
    background:#1f2937;
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 30px black;
}

h1 {
    text-align:center;
}

.avatar {
    text-align:center;
    font-size:80px;
}

#chat {
    background:#111827;
    height:250px;
    overflow:auto;
    border-radius:15px;
    padding:10px;
    margin:20px 0;
}

input {
    width:65%;
    padding:12px;
    border-radius:10px;
    border:0;
}

button {
    padding:14px;
    border:0;
    border-radius:15px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.send {
    width:25%;
}

.buttons {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

video {
    width:100%;
    margin-top:15px;
    border-radius:15px;
}

a {
    color:#60a5fa;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V4</h1>


<div class="avatar">
🙂
</div>


<div id="chat">

<p><b>Wariat AI:</b> Siema 👋 Jestem gotowy.</p>

</div>



<input id="msg" placeholder="Napisz pytanie">

<button class="send" onclick="sendMessage()">
Wyślij
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="searchWeb()">
🌐 Internet
</button>


<button onclick="memory()">
🧠 Pamięć
</button>


</div>


</div>



<script>


function addMessage(text){

let chat=document.getElementById("chat");

chat.innerHTML += "<p>"+text+"</p>";

chat.scrollTop=chat.scrollHeight;

}



function sendMessage(){

let input=document.getElementById("msg");

let text=input.value.trim();


if(text==="") return;


addMessage(
"<b>Ty:</b> "+text
);


localStorage.setItem(
"ostatnie_pytanie",
text
);


addMessage(
"<b>Wariat AI:</b> Zapisałem pytanie. Moduł AI będzie kolejnym etapem."
);


input.value="";

}






function searchWeb(){

let pytanie=prompt(
"Wpisz czego mam poszukać:"
);


if(!pytanie) return;


addMessage(
"🌐 Szukam: <b>"+pytanie+"</b>"
);


let q=encodeURIComponent(pytanie);



addMessage(
"🔎 <a target='_blank' href='https://www.google.com/search?q="+q+"'>Wyniki wyszukiwania</a>"
);



addMessage(
"📷 <a target='_blank' href='https://www.google.com/search?tbm=isch&q="+q+"'>Zdjęcia</a>"
);


}






let recognition;



function startVoice(){


if(!("webkitSpeechRecognition" in window)){

alert(
"Uruchom aplikację w Chrome na Androidzie."
);

return;

}


recognition =
new webkitSpeechRecognition();


recognition.lang="pl-PL";


recognition.onresult=function(e){


let text =
e.results[0][0].transcript;


document.getElementById("msg").value=text;


sendMessage();


};


recognition.start();


}






function startCamera(){


navigator.mediaDevices.getUserMedia({

video:true

})

.then(function(stream){


let video=document.createElement("video");


video.srcObject=stream;


video.autoplay=true;


video.playsInline=true;


document.querySelector(".app").appendChild(video);


})

.catch(function(){

alert(
"Brak dostępu do kamery."
);

});


}







function memory(){


let data=
localStorage.getItem(
"ostatnie_pytanie"
);



if(data){

addMessage(
"🧠 Pamiętam ostatnie pytanie: "+data
);

}

else{

addMessage(
"🧠 Jeszcze nic nie zapamiętałem."
);

}


}






if("serviceWorker" in navigator){

navigator.serviceWorker.register(
"sw.js?v=4"
);

}


</script>


</body>
</html>
