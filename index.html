<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>

body {
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app {
    width:95%;
    max-width:500px;
    background:#1f2937;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 30px #000;
}

h1 {
    text-align:center;
}

.avatar {
    text-align:center;
    font-size:80px;
}

#chat {
    background:#111827;
    min-height:220px;
    margin:20px 0;
    padding:10px;
    border-radius:15px;
    overflow:auto;
}

input {
    width:65%;
    padding:12px;
    border-radius:10px;
    border:0;
}

button {
    padding:14px;
    border:0;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:15px;
}

.send {
    width:25%;
}

.buttons {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

video {
    width:100%;
    margin-top:15px;
    border-radius:15px;
}

img {
    width:100%;
    border-radius:15px;
    margin-top:10px;
}

</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI</h1>


<div class="avatar">
🙂
</div>


<div id="chat">

<p>Wariat AI: Siema 👋 Jestem gotowy.</p>

</div>



<input id="msg" placeholder="Zapytaj mnie...">

<button class="send" onclick="sendMessage()">
Wyślij
</button>


<br><br>


<div class="buttons">

<button onclick="startVoice()">🎤 Głos</button>

<button onclick="startCamera()">📷 Kamera</button>

<button onclick="searchWeb()">🌐 Internet</button>

<button onclick="memory()">🧠 Pamięć</button>

</div>


</div>



<script>


function addMessage(text){

let chat=document.getElementById("chat");

chat.innerHTML += "<p>"+text+"</p>";

chat.scrollTop=chat.scrollHeight;

}



function sendMessage(){

let input=document.getElementById("msg");

if(input.value=="") return;


addMessage("<b>Ty:</b> "+input.value);

addMessage("<b>Wariat AI:</b> Zapamiętałem pytanie. Następny etap podłączymy prawdziwy mózg AI.");

input.value="";

}





function searchWeb(){


let pytanie =
prompt("Czego mam poszukać?");


if(!pytanie) return;



addMessage(
"<b>Wariat AI:</b> Szukam: "+pytanie
);



let google =
"https://www.google.com/search?q="
+encodeURIComponent(pytanie);



let grafika =
"https://www.google.com/search?tbm=isch&q="
+encodeURIComponent(pytanie);



addMessage(
"🔎 <a style='color:#60a5fa' target='_blank' href='"+google+"'>Otwórz wyniki</a>"
);


addMessage(
"📷 <a style='color:#60a5fa' target='_blank' href='"+grafika+"'>Zobacz zdjęcia</a>"
);


}





let recognition;


function startVoice(){


if(!('webkitSpeechRecognition' in window)){

alert("Otwórz aplikację w Chrome na Androidzie.");

return;

}


recognition=new webkitSpeechRecognition();

recognition.lang="pl-PL";


recognition.onresult=function(e){

let tekst=e.results[0][0].transcript;

document.getElementById("msg").value=tekst;

sendMessage();

};


recognition.start();


}







function startCamera(){


navigator.mediaDevices.getUserMedia({

video:true

})

.then(stream=>{


let video=document.createElement("video");

video.srcObject=stream;

video.autoplay=true;

video.playsInline=true;


document.querySelector(".app").appendChild(video);


})


.catch(()=>{

alert("Brak dostępu do kamery.");

});


}






function memory(){


addMessage(
"🧠 Pamięć lokalna zostanie dodana w następnym module."
);


}






if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}


</script>


</body>
</html>
