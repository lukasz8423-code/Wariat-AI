<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V13.0</title>

<meta name="theme-color" content="#2563eb">


<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{

width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;

}



h1{
text-align:center;
}


.avatar{

font-size:80px;
text-align:center;

}



.status{

background:#111827;
padding:12px;
border-radius:15px;
text-align:center;
margin-bottom:10px;

}



#chat{

height:320px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}



.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}



.user{

background:#2563eb;

}



.ai{

background:#374151;

}




input{

width:90%;
padding:12px;
border:0;
border-radius:10px;
margin-top:10px;

}




button{

width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;

}




.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}



video,img{

width:100%;
border-radius:15px;
margin-top:15px;

}


</style>

</head>



<body>


<div class="app">


<h1>🤖 Wariat AI V13.0</h1>


<div class="avatar">
😎
</div>



<div class="status">
🧠 Pamięć + Zewnętrzny mózg AI
</div>




<div id="chat"></div>




<input id="msg" placeholder="Napisz do mnie">



<button id="sendBtn">
Wyślij
</button>





<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Reset
</button>


</div>



<div id="camera"></div>

<div id="photo"></div>




<script>


let chat =
document.getElementById("chat");


let stream=null;

let video=null;





// ==========================
// PAMIĘĆ V13
// ==========================


let memory={

name:"",
likes:[],
facts:[],
history:[]

};






function loadMemory(){


let saved =
localStorage.getItem("wariat_v12_memory");



if(!saved){

saved =
localStorage.getItem("wariat_memory");

}




if(saved){

try{

let old=JSON.parse(saved);


memory={

name:old.name || "",

likes:old.likes || [],

facts:old.facts || [],

history:old.history || []

};


}

catch(e){


console.log("Błąd pamięci");


}


}



}





function saveMemory(){


localStorage.setItem(
"wariat_v12_memory",
JSON.stringify(memory)
);


}






function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}





function speak(text){


let speech =
new SpeechSynthesisUtterance(text);



speech.lang="pl-PL";


speech.rate=0.95;


speechSynthesis.speak(speech);


}
// ==========================
// MÓZG WARIAT AI V13
// ==========================


async function askExternalAI(question){


try{


let response =
await fetch("http://localhost:3001/ai",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

question:question,

memory:memory

})

});



let data =
await response.json();



return data.answer;



}

catch(e){


return null;


}



}








async function aiBrain(text){


let q=text.toLowerCase().trim();





// IMIĘ


if(
q.startsWith("mam na imię") ||
q.startsWith("mam na imie")
){


let name=text
.replace(/^mam na imię/i,"")
.replace(/^mam na imie/i,"")
.trim();



if(name){

memory.name =
name.charAt(0).toUpperCase()
+
name.slice(1);



saveMemory();



return "Zapamiętałem. Od teraz będę mówił do Ciebie "+memory.name+".";

}


}






if(
q.includes("jak mam na imię") ||
q.includes("jak mam na imie")
){


return memory.name
?
"Masz na imię "+memory.name+"."
:
"Nie znam jeszcze Twojego imienia.";

}







// LUBIĘ


if(
q.includes("zapamiętaj") &&
(q.includes("lubię") || q.includes("lubie"))
){


let like=text
.replace(/zapamiętaj/i,"")
.replace(/że/i,"")
.replace(/lubię/i,"")
.replace(/lubie/i,"")
.trim();



if(like){


memory.likes.push(like);


saveMemory();


return "Zapamiętałem, że lubisz "+like+".";

}


}








// CO PAMIĘTASZ


if(
q.includes("co pamiętasz") ||
q.includes("co pamietasz")
){


let answer="";


if(memory.name){

answer+="Masz na imię "+memory.name+". ";

}



if(memory.likes.length){

answer+="Lubisz: "+
memory.likes.join(", ")+". ";

}



if(memory.facts.length){

answer+="Informacje: "+
memory.facts.join(", ")+". ";

}



return answer ||
"Moja pamięć jest pusta.";

}






// LOKALNA BAZA


let knowledge=[


{
words:["ets2","ets","euro truck"],
answer:
"Euro Truck Simulator 2 to gra firmy SCS Software, w której prowadzisz ciężarówki po Europie."
},


{
words:["gta"],
answer:
"GTA to seria gier firmy Rockstar Games."
},


{
words:["barszcz sosnowskiego","barszcz"],
answer:
"Barszcz Sosnowskiego to duża roślina inwazyjna. Kontakt z jej sokiem może powodować poważne podrażnienia skóry."
},


{
words:["autobus"],
answer:
"Autobus to pojazd przeznaczony do przewozu większej liczby pasażerów."
}


];





for(let item of knowledge){


for(let word of item.words){


if(q.includes(word)){


return item.answer;


}


}


}






// JEŻELI NIE ZNA -> PYTA AI


let aiAnswer =
await askExternalAI(text);



if(aiAnswer){


return aiAnswer;


}





return "Mój dodatkowy mózg jest niedostępny. Uruchom server.js.";

}








// ==========================
// WYSYŁANIE
// ==========================


async function sendMessage(){


let input =
document.getElementById("msg");



let text =
input.value.trim();



if(!text)return;




addMessage(text,"user");



let answer =
await aiBrain(text);



addMessage(answer,"ai");


speak(answer);



input.value="";


}





document
.getElementById("sendBtn")
.addEventListener(
"click",
sendMessage
);




document
.getElementById("msg")
.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){

sendMessage();

}


});

// ==========================
// GŁOS
// ==========================


function startVoice(){


let SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SR){

alert("Brak obsługi głosu");

return;

}



let rec=new SR();


rec.lang="pl-PL";


rec.start();



rec.onresult=function(e){


document.getElementById("msg").value=
e.results[0][0].transcript;



sendMessage();


};


}







// ==========================
// KAMERA
// ==========================


async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:true,

audio:false

});



video=document.createElement("video");


video.autoplay=true;


video.playsInline=true;


video.srcObject=stream;



document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera uruchomiona.",
"ai"
);


}


catch(e){


addMessage(
"❌ Kamera: "+e.message,
"ai"
);


}



}






function takeView(){


if(!video){

addMessage(
"Najpierw uruchom kamerę.",
"ai"
);


return;

}



let canvas =
document.createElement("canvas");



canvas.width=video.videoWidth;


canvas.height=video.videoHeight;



let ctx =
canvas.getContext("2d");


ctx.drawImage(video,0,0);



document.getElementById("photo").innerHTML=
"<img src='"+canvas.toDataURL()+"'>";



addMessage(
"👁️ Obraz zapisany.",
"ai"
);


}






function stopCamera(){


if(stream){

stream.getTracks()
.forEach(t=>t.stop());

}


stream=null;

video=null;


document.getElementById("camera").innerHTML="";


addMessage(
"⛔ Kamera wyłączona.",
"ai"
);


}







function showMemory(){


addMessage(
"🧠 "+aiBrain("co pamiętasz"),
"ai"
);


}







function clearMemory(){


memory={

name:"",
likes:[],
facts:[],
history:[]

};


saveMemory();


addMessage(
"🗑️ Pamięć wyczyszczona.",
"ai"
);


}








window.onload=function(){


loadMemory();



if(memory.name){


addMessage(
"😎 Witaj ponownie "+memory.name+". Pamięć załadowana.",
"ai"
);


}

else{


addMessage(
"😎 Wariat AI V13 gotowy.",
"ai"
);


}



};



</script>


</body>

</html>
