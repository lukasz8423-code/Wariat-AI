<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wariat AI V12.1</title>

<meta name="theme-color" content="#2563eb">


<style>

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.app{

width:95%;
max-width:520px;
background:#1f2937;
padding:20px;
border-radius:20px;
box-shadow:0 0 30px black;

}


h1{

text-align:center;

}


.avatar{

font-size:80px;
text-align:center;

}



.status{

background:#111827;
padding:12px;
border-radius:15px;
text-align:center;
margin-bottom:10px;

}



#chat{

height:320px;
overflow:auto;
background:#111827;
padding:10px;
border-radius:15px;

}



.msg{

padding:10px;
margin:8px 0;
border-radius:12px;

}



.user{

background:#2563eb;

}



.ai{

background:#374151;

}



input{

width:90%;
padding:12px;
border:0;
border-radius:10px;
margin-top:10px;

}



button{

width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:15px;
background:#2563eb;
color:white;
font-size:16px;

}



.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}



video,img{

width:100%;
border-radius:15px;
margin-top:15px;

}


</style>

</head>


<body>


<div class="app">


<h1>🤖 Wariat AI V12.1</h1>


<div class="avatar">
😎
</div>



<div class="status">
🧠 Pamięć + Nowy mózg AI
</div>



<div id="chat"></div>



<input id="msg" placeholder="Napisz do mnie">



<button id="sendBtn">
Wyślij
</button>



<div class="buttons">


<button onclick="startVoice()">
🎤 Głos
</button>


<button onclick="startCamera()">
📷 Kamera
</button>


<button onclick="takeView()">
👁️ Zobacz
</button>


<button onclick="stopCamera()">
⛔ Stop
</button>


<button onclick="showMemory()">
🧠 Pamięć
</button>


<button onclick="clearMemory()">
🗑️ Reset
</button>


</div>



<div id="camera"></div>

<div id="photo"></div>



<script>


let chat =
document.getElementById("chat");


let stream=null;

let video=null;




// =====================
// PAMIĘĆ
// =====================


let memory={

name:"",
facts:[],
history:[]

};





function loadMemory(){


let saved =
localStorage.getItem("wariat_v12_memory");



// odzyskanie pamięci V11

if(!saved){

saved =
localStorage.getItem("wariat_memory");

}




if(saved){

try{

memory=JSON.parse(saved);

}

catch(e){

memory={
name:"",
facts:[],
history:[]
};

}

}


}






function saveMemory(){


localStorage.setItem(
"wariat_v12_memory",
JSON.stringify(memory)
);



}






function addMessage(text,type){


let div=document.createElement("div");


div.className="msg "+type;


div.innerText=text;


chat.appendChild(div);


chat.scrollTop=
chat.scrollHeight;


}






function speak(text){


let s=
new SpeechSynthesisUtterance(text);


s.lang="pl-PL";


speechSynthesis.speak(s);


}

// ============================
// MÓZG WARIAT AI V12.1
// ============================


function aiBrain(text){

let q=text.toLowerCase().trim();




// ZAPIS IMIENIA

if(
(q.includes("mam na imię") ||
q.includes("mam na imie"))
&&
!q.includes("jak mam")
){

let name=text
.replace(/mam na imię/i,"")
.replace(/mam na imie/i,"")
.trim();



memory.name =
name.charAt(0).toUpperCase()
+
name.slice(1);



saveMemory();


return "Zapamiętałem. Od teraz będę mówił do Ciebie "+memory.name+".";

}





// ODCZYT IMIENIA


if(
q.includes("jak mam na imię") ||
q.includes("jak mam na imie")
){

return memory.name
?
"Masz na imię "+memory.name+"."
:
"Jeszcze nie znam Twojego imienia.";

}






// ZAPIS FAKTÓW


if(
q.startsWith("zapamiętaj") ||
q.startsWith("zapamietaj")
){


let fact=text
.replace(/zapamiętaj/i,"")
.replace(/zapamietaj/i,"")
.replace(/^że\s+/i,"")
.trim();



if(fact){

memory.facts.push(fact);

saveMemory();


return "Zapamiętałem: "+fact+".";

}


}







// PAMIĘĆ


if(
q.includes("co pamiętasz") ||
q.includes("co pamietasz")
){


let result="";


if(memory.name){

result+="Masz na imię "+memory.name+". ";

}



if(memory.facts.length){

result+="Pamiętam: "+
memory.facts.join(", ")+". ";

}



return result ||
"Moja pamięć jest pusta.";

}







// BAZA WIEDZY


let knowledge=[


{
keys:[
"ets",
"ets2",
"euro truck",
"scs",
"ciężarów",
"ciezarów"
],

answer:
"Euro Truck Simulator 2 to gra firmy SCS Software. Prowadzisz ciężarówki po Europie, rozwijasz firmę i wykonujesz transporty."
},



{
keys:[
"gta",
"grand theft auto"
],

answer:
"GTA to seria gier firmy Rockstar Games znana z otwartego świata."
},



{
keys:[
"barszcz sosnowskiego",
"barszcz"
],

answer:
"Barszcz Sosnowskiego to duża roślina inwazyjna. Kontakt z jej sokiem może powodować silne podrażnienia skóry."
},



{
keys:[
"sztuczna inteligencja",
"ai"
],

answer:
"AI to sztuczna inteligencja, czyli technologia pozwalająca komputerom analizować informacje i wykonywać zadania."
},



{
keys:[
"android",
"redmi",
"telefon"
],

answer:
"Android to system operacyjny używany w telefonach. Redmi to marka smartfonów Xiaomi."
}


];





for(let item of knowledge){

for(let word of item.keys){

if(q.includes(word)){

return item.answer;

}

}

}







// CZAS


if(
q.includes("godzina") ||
q.includes("czas")
){

let d=new Date();


return "Jest teraz godzina "+
d.getHours()+":"+
String(d.getMinutes()).padStart(2,"0")+".";

}







// DATA


if(
q.includes("data") ||
q.includes("jaki dzień") ||
q.includes("jaki dzien")
){

return "Dzisiaj jest "+
new Date().toLocaleDateString("pl-PL")+".";

}






// HISTORIA


memory.history.push({

user:text,

time:new Date().toLocaleString()

});


if(memory.history.length>30){

memory.history.shift();

}


saveMemory();





return "Nie mam jeszcze odpowiedzi na to pytanie. To miejsce jest przygotowane pod prawdziwy silnik AI.";

}







// ============================
// WYSYŁANIE
// ============================


function sendMessage(){


let input =
document.getElementById("msg");


let text =
input.value.trim();



if(!text)return;



addMessage(text,"user");



let answer =
aiBrain(text);



addMessage(answer,"ai");



speak(answer);



input.value="";

}





document
.getElementById("sendBtn")
.addEventListener(
"click",
sendMessage
);





document
.getElementById("msg")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

sendMessage();

}

}
);








// ============================
// GŁOS
// ============================


function startVoice(){


let SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SR){

alert("Brak obsługi głosu");

return;

}



let rec=new SR();


rec.lang="pl-PL";


rec.start();



rec.onresult=function(e){


document.getElementById("msg").value =
e.results[0][0].transcript;



sendMessage();


};


}








// ============================
// KAMERA
// ============================


async function startCamera(){


try{


stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});



video=document.createElement("video");


video.autoplay=true;

video.playsInline=true;


video.srcObject=stream;



document.getElementById("camera").innerHTML="";


document.getElementById("camera")
.appendChild(video);



addMessage(
"📷 Kamera działa.",
"ai"
);



}

catch(e){

addMessage(
"❌ Kamera: "+e.message,
"ai"
);

}


}








function takeView(){


if(!video){

addMessage(
"Najpierw uruchom kamerę.",
"ai"
);

return;

}



let canvas =
document.createElement("canvas");



canvas.width=video.videoWidth;

canvas.height=video.videoHeight;



let ctx =
canvas.getContext("2d");



ctx.drawImage(video,0,0);



document.getElementById("photo").innerHTML =
"<img src='"+canvas.toDataURL("image/jpeg")+"'>";



addMessage(
"👁️ Zdjęcie wykonane.",
"ai"
);


}








function stopCamera(){


if(stream){

stream.getTracks()
.forEach(t=>t.stop());

}


stream=null;

video=null;


document.getElementById("camera").innerHTML="";


addMessage(
"⛔ Kamera wyłączona.",
"ai"
);


}








function showMemory(){


addMessage(
"🧠 "+aiBrain("co pamiętasz"),
"ai"
);


}








function clearMemory(){


memory={

name:"",
facts:[],
history:[]

};


saveMemory();


addMessage(
"🗑️ Pamięć wyczyszczona.",
"ai"
);


}








window.onload=function(){


loadMemory();



if(memory.name){


addMessage(
"😎 Witaj ponownie "+memory.name+". Pamięć załadowana.",
"ai"
);


}else{


addMessage(
"😎 Wariat AI V12.1 gotowy.",
"ai"
);


}



};



</script>


</body>

</html>
